<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var s=localStorage.getItem("kyudo_font_scale");if(s)document.documentElement.style.setProperty("--font-scale",s);}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>リアル八節くん ─ 動画比較</title>
  <meta name="description" content="弓道の稽古動画を2本並べて同期再生・スロー再生・コマ送りで比較し、フォームの違いをチェックできます。" />
  <meta name="keywords" content="弓道, 射法八節, 動画比較, フォームチェック, スロー再生, UNIQLO UI" />

  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

  <script src="sync.js"></script>
  <script src="tutorial.js"></script>
  <meta name="theme-color" content="#ffffff">
<!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
<!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" href="apple-icon.png">
  <meta name="msapplication-TileImage" content="ms-icon-144x144.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    /* ================================================================
       UNIQLO STYLE DESIGN SYSTEM & TOKENS (動画比較版)
       ================================================================ */
    :root {
      --uq-red: #E60012;
      --uq-red-hover: #CC0010;
      --uq-red-light: #FFF0F0;
      --uq-black: #111111;
      --uq-dark-gray: #333333;
      --uq-gray: #666666;
      --uq-light-gray: #999999;
      --uq-border: #E5E5E5;
      --uq-border-light: #F0F0F0;
      --uq-bg: #FFFFFF;
      --uq-surface: #F8F8F8;
      --uq-surface-subtle: #FAFAFA;
      
      --primary: var(--uq-red);
      --text: var(--uq-black);
      --text-sub: var(--uq-gray);
      --text-muted: var(--uq-light-gray);
      --line: var(--uq-border);
      --line-subtle: var(--uq-border-light);
      --bg: var(--uq-bg);
      --panel: var(--uq-surface);

      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 6px;
      --radius-pill: 9999px;

      --font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-scale: 1;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
    }

    [data-theme="dark"] {
      --uq-black: #F5F5F5;
      --uq-dark-gray: #E0E0E0;
      --uq-gray: #A0A0A0;
      --uq-light-gray: #666666;
      --uq-border: #2A2A2A;
      --uq-border-light: #222222;
      --uq-bg: #121212;
      --uq-surface: #1C1C1C;
      --uq-surface-subtle: #181818;
      --uq-red-light: rgba(230, 0, 18, 0.15);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.6);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.8);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      font-size: calc(14px * var(--font-scale));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
      transition: all 0.15s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      user-select: none;
      display: inline-block;
      vertical-align: middle;
    }

    /* HEADER */
    .uq-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 52px;
      flex-shrink: 0;
    }

    .uq-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .uq-logo-box {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
    }

    .uq-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .uq-app-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .uq-app-title {
      font-size:calc(15px * var(--font-scale));
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .uq-tag-badge {
      background: var(--uq-black);
      color: #FFFFFF;
      font-size:calc(9px * var(--font-scale));
      font-weight: 800;
      padding: 1px 5px;
      border-radius: var(--radius-sm);
    }

    [data-theme="dark"] .uq-tag-badge {
      background: var(--uq-red);
    }

    .uq-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .uq-icon-btn {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text);
    }

    .uq-icon-btn:hover {
      background: var(--panel);
    }

    /* MAIN CONTAINER */
    .uq-main-container {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .uq-section-title {
      font-size:calc(12px * var(--font-scale));
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }

    /* COMPARE AREA */
    .uq-compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .uq-compare-grid.vertical {
      grid-template-columns: 1fr;
    }

    /* スマホ縦画面では、文字サイズを大きくした時に2列比較だと
       各カードの最小幅(select等)が確保できず右にはみ出すため、
       手動で切り替えなくても自動で1列表示に切り替える */
    @media (max-width: 480px) {
      .uq-compare-grid {
        grid-template-columns: 1fr;
      }
    }

    .uq-slot-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow-sm);
      position: relative;
      min-width: 0; /* グリッドアイテムが内容(select等)に押されて列幅を超えないように */
    }

    .uq-slot-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .uq-slot-badge {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-sm);
      background: var(--uq-red);
      color: #FFFFFF;
      font-weight: 900;
      font-size:calc(11px * var(--font-scale));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .uq-slot-select {
      flex: 1;
      min-width: 0; /* 文字サイズを上げてもselectがはみ出して縮まなくなるのを防ぐ */
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font-family: inherit;
      font-size:calc(12px * var(--font-scale));
      font-weight: 700;
      outline: none;
    }

    .uq-video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .uq-video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Controls Bar */
    .uq-compare-hud {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .uq-timeline-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .uq-time-label {
      font-family: 'Inter', monospace;
      font-size:calc(11px * var(--font-scale));
      font-weight: 700;
      color: var(--text-sub);
      min-width: 36px;
      text-align: center;
    }

    .uq-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
      outline: none;
      cursor: pointer;
    }

    .uq-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      background: var(--uq-red);
      cursor: pointer;
    }

    .uq-hud-btns {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .uq-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .uq-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size:calc(12px * var(--font-scale));
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
    }

    .uq-btn:hover {
      background: var(--panel);
      border-color: var(--uq-gray);
    }

    .uq-btn.primary {
      background: var(--uq-red) !important;
      color: #FFFFFF !important;
      border-color: var(--uq-red) !important;
    }

    .uq-btn.primary:hover {
      background: var(--uq-red-hover) !important;
    }

    .uq-btn.active-red {
      background: var(--uq-red) !important;
      color: #FFFFFF !important;
      border-color: var(--uq-red) !important;
    }

    .uq-btn.danger {
      color: var(--uq-red);
      background: var(--uq-red-light);
      border-color: rgba(230,0,18,0.2);
    }

    /* Video Library */
    .uq-library-item {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      row-gap: 10px;
      margin-bottom: 8px;
    }

    .uq-lib-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .uq-lib-title {
      font-size:calc(14px * var(--font-scale));
      font-weight: 800;
      color: var(--text);
    }

    .uq-lib-meta {
      font-size:calc(11px * var(--font-scale));
      color: var(--text-muted);
      font-family: 'Inter', monospace;
    }

    .uq-lib-tag {
      display: inline-block;
      font-size:calc(10px * var(--font-scale));
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text-sub);
      width: fit-content;
      margin-top: 2px;
    }

    .uq-lib-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .uq-lib-actions .uq-btn {
      white-space: nowrap; /* ボタン内で文字が折り返して高さが伸び、隣の行と近づくのを防ぐ */
    }

    /* Modal */
    .uq-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .uq-modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .uq-modal-card {
      background: var(--bg);
      width: 100%;
      max-width: 420px;
      border-radius: var(--radius-md);
      padding: 24px;
      position: relative;
      box-shadow: var(--shadow-lg);
    }

    .uq-input-text {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size:calc(13px * var(--font-scale));
      outline: none;
    }

    .uq-empty-box {
      border: 2px dashed var(--line);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size:calc(13px * var(--font-scale));
      background: var(--panel);
    }

    /* DRAWER */
    .uq-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .uq-drawer-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .uq-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: var(--bg);
      z-index: 2001;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .uq-drawer.open {
      right: 0;
    }

    .uq-drawer-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .uq-drawer-title {
      font-size:calc(16px * var(--font-scale));
      font-weight: 900;
      color: var(--text);
    }

    .uq-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }

    .uq-drawer-section-label {
      font-size:calc(10px * var(--font-scale));
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 12px 20px 6px;
    }

    .uq-drawer-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      font-size:calc(13.5px * var(--font-scale));
      font-weight: 700;
      color: var(--text);
      transition: background 0.15s;
    }

    .uq-drawer-link:hover {
      background: var(--panel);
    }

    .uq-drawer-link.active {
      color: var(--uq-red);
      background: var(--uq-red-light);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="uq-header">
    <div class="uq-brand">
      <div class="uq-logo-box"><img src="favicon-96x96.png" alt="リアル八節くん" width="30" height="30"></div>
      <div class="uq-app-title-wrap">
        <span class="uq-app-title">
          リアル八節くん
          <span class="uq-tag-badge">動画比較</span>
        </span>
      </div>
    </div>
    <div class="uq-header-actions">
      <button class="uq-icon-btn" id="themeToggleBtn" aria-label="テーマ切替" title="ダーク/ライト切替">
        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
      </button>
      <button class="uq-icon-btn" id="menuToggleBtn" onclick="toggleDrawer()" aria-label="メニュー">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="uq-main-container">
    <!-- SECTION 1: 比較プレイヤー -->
    <section>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="uq-section-title" style="margin-bottom:0; border:none; padding:0;">
          <span class="material-symbols-outlined" style="font-size:calc(16px * var(--font-scale));">splitscreen</span>
          動画の比較再生
        </h2>
        <button class="uq-btn" id="layoutToggleBtn" style="padding:4px 8px; font-size:calc(11px * var(--font-scale)); width:auto;">
          <span class="material-symbols-outlined" style="font-size:calc(15px * var(--font-scale));">view_column</span>
          左右 / 上下切替
        </button>
      </div>

      <div class="uq-compare-grid" id="compareGrid">
        <!-- Slot A -->
        <div class="uq-slot-card">
          <div class="uq-slot-header">
            <span class="uq-slot-badge">A</span>
            <select class="uq-slot-select" id="selectA"><option value="">動画を選択...</option></select>
          </div>
          <div class="uq-video-wrapper">
            <video id="videoA" playsinline></video>
          </div>
        </div>

        <!-- Slot B -->
        <div class="uq-slot-card">
          <div class="uq-slot-header">
            <span class="uq-slot-badge" style="background:var(--uq-black);">B</span>
            <select class="uq-slot-select" id="selectB"><option value="">動画を選択...</option></select>
          </div>
          <div class="uq-video-wrapper">
            <video id="videoB" playsinline></video>
          </div>
        </div>
      </div>

      <!-- Unified Controller HUD -->
      <div class="uq-compare-hud">
        <div class="uq-timeline-row">
          <span class="uq-time-label" id="seekCurrent">0:00</span>
          <input type="range" class="uq-slider" id="seekBar" min="0" max="0" step="0.01" value="0" disabled>
          <span class="uq-time-label" id="seekDuration">0:00</span>
        </div>

        <div class="uq-hud-btns">
          <div class="uq-btn-group">
            <button class="uq-btn primary" id="playPauseBtn" title="再生 / 一時停止">
              <span class="material-symbols-outlined" id="playIcon">play_arrow</span>
              <span id="playLabel">再生</span>
            </button>
            <button class="uq-btn" id="resetSyncBtn" title="先頭に戻す">
              <span class="material-symbols-outlined">replay</span>
            </button>
            <button class="uq-btn" id="frameBackBtn" title="1コマ戻す">
              <span class="material-symbols-outlined">skip_previous</span>
            </button>
            <button class="uq-btn" id="frameFwdBtn" title="1コマ進める">
              <span class="material-symbols-outlined">skip_next</span>
            </button>
          </div>

          <div class="uq-btn-group">
            <select class="uq-slot-select" id="speedSelect" style="width:auto; padding:5px 8px;">
              <option value="0.1">0.1x (超スロー)</option>
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x (標準)</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- SECTION 2: 動画ライブラリ -->
    <section>
      <div style="display:flex; flex-wrap:wrap; row-gap:8px; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 class="uq-section-title" style="margin-bottom:0; border:none; padding:0;">
          <span class="material-symbols-outlined" style="font-size:calc(16px * var(--font-scale));">video_library</span>
          保存済み動画ライブラリ
        </h2>
        <button class="uq-btn primary" id="addVideoBtn" style="padding:5px 10px; font-size:calc(11.5px * var(--font-scale)); width:auto; white-space:nowrap;">
          ＋ 動画を追加
        </button>
      </div>

      <input type="file" id="fileInput" accept="video/*" multiple style="display:none;">
      <div id="storageStatusBox" style="display:none; font-size:calc(11.5px * var(--font-scale)); border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:10px;"></div>
      <div id="driveBackupStatusBox" style="display:none; font-size:calc(11.5px * var(--font-scale)); border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:10px;"></div>
      <div id="library-root"></div>
    </section>
  </main>

  <!-- ADD VIDEO MODAL -->

  <script>
    const DB_NAME = 'kyudo_video_db';
    const STORE_NAME = 'videos';
    const META_KEY = 'kyudo_video_meta_v1';

    function openVideoDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbPutVideo(id, blob) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({ id, blob });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGetVideo(id) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result ? req.result.blob : null);
        req.onerror = () => reject(req.error);
      });
    }

    // ---- 永続化ストレージ ----
    // IndexedDBは「ベストエフォート型」で保存されるため、端末の空き容量が
    // 少なくなった場合などにブラウザが確認なしで自動削除することがある。
    // navigator.storage.persist() を許可してもらえれば、この端末の
    // ストレージデータは自動削除の対象から除外される（ユーザー自身が
    // ブラウザの「サイトデータを削除」を行った場合は防げない）。
    async function ensurePersistentStorage() {
      if (!(navigator.storage && navigator.storage.persist && navigator.storage.persisted)) {
        return 'unsupported';
      }
      try {
        const already = await navigator.storage.persisted();
        if (already) return true;
        const granted = await navigator.storage.persist();
        return granted;
      } catch (e) {
        return 'unsupported';
      }
    }

    function renderStorageStatus(result) {
      const box = document.getElementById('storageStatusBox');
      if (result === 'unsupported') {
        box.style.display = 'none';
        return;
      }
      box.style.display = 'block';
      if (result === true) {
        box.style.background = 'var(--panel)';
        box.style.color = 'var(--text-sub)';
        box.style.border = '1px solid var(--line)';
        box.innerHTML = '💾 このブラウザで保存した動画は、自動削除の対象外になっています。';
      } else {
        box.style.background = 'var(--uq-red-light)';
        box.style.color = 'var(--uq-red)';
        box.style.border = '1px solid rgba(230,0,18,0.2)';
        box.innerHTML = '⚠ 保存データの永続化が許可されませんでした。端末の空き容量が少なくなると、保存した動画が自動的に削除される場合があります。ホーム画面に追加して開くと許可されやすくなります。';
      }
    }

    ensurePersistentStorage().then(renderStorageStatus);

    // ---- Googleドライブ動画バックアップの状態表示 ----
    // ログイン状態はページ内のsync.jsが管理しているため、その変化を購読して
    // 「バックアップが有効かどうか」をこのページ上部にも分かりやすく表示する。
    // （ログイン自体は設定ページで行う想定）
    function renderDriveBackupStatus(status) {
      const box = document.getElementById('driveBackupStatusBox');
      if (!box) return;
      if (!status || !status.configured) {
        box.style.display = 'none';
        return;
      }
      box.style.display = 'block';
      if (status.signedIn) {
        box.style.background = 'var(--panel)';
        box.style.color = 'var(--text-sub)';
        box.style.border = '1px solid var(--line)';
        box.innerHTML = '☁ Googleドライブへの動画バックアップ: 有効です。新しく追加した動画は自動でバックアップされます。';
      } else {
        box.style.background = 'var(--uq-red-light)';
        box.style.color = 'var(--uq-red)';
        box.style.border = '1px solid rgba(230,0,18,0.2)';
        box.innerHTML = '☁ Googleドライブへの動画バックアップは無効です（未ログイン）。<a href="設定.html" style="color:inherit; text-decoration:underline; font-weight:800;">設定ページ</a>でログインすると、動画も自動でバックアップされ、この端末で消えても復元できるようになります。';
      }
    }

    if (window.kyudoSyncOnChange) {
      window.kyudoSyncOnChange(function (status) {
        renderDriveBackupStatus(status);
        renderLibrary();
      });
    } else {
      renderDriveBackupStatus(null);
    }

    // メタ情報(タイトル等)はGoogleドライブ同期の対象だが、動画本体(IndexedDB)は
    // 同期対象外なので、別端末やデータ消去後は「一覧には出るが実体が無い」状態になりうる。
    // そのケースを事前に検出してライブラリ表示・選択時にわかるようにする。
    async function idbVideoExists(id) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).count(id);
        req.onsuccess = () => resolve(req.result > 0);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbDeleteVideo(id) {
      const db = await openVideoDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function loadMeta() {
      try {
        const raw = localStorage.getItem(META_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function saveMeta(list) {
      localStorage.setItem(META_KEY, JSON.stringify(list));
    }

    function updateMetaItem(id, patch) {
      const meta = loadMeta();
      const item = meta.find(m => String(m.id) === String(id));
      if (!item) return;
      Object.assign(item, patch);
      saveMeta(meta);
    }

    // ================================================================
    // Googleドライブへの動画本体バックアップ（任意・ログイン時のみ）
    // ------------------------------------------------------------
    // sync.js は「タイトル等の軽い情報」しか同期しないため、動画ファイル
    // そのものは常にこの端末のIndexedDBにしか無かった。ここでは、動画
    // ファイル自体もユーザー自身のGoogleドライブ（アプリ専用の隠し領域
    // = appDataFolder、他のファイルとは分離されており本人にも一覧表示
    // されない）へアップロードし、他端末や消去後でもダウンロードし直せる
    // ようにする。
    //
    // ・容量はユーザー自身のGoogleアカウントの無料枠(15GB)を使うので、
    //   運営側の費用は発生しない。
    // ・ファイルが大きいため、途中で切れても続きから再送できる
    //   「レジューム可能アップロード」を使う。アップロード状況(URL)は
    //   localStorageに保存しておき、ページを閉じても次回続きから送れる。
    // ================================================================
    const DRIVE_UPLOAD_CHUNK = 8 * 1024 * 1024; // 8MB単位で送る
    const DRIVE_SESSION_KEY_PREFIX = 'kyudo_drive_upload_session:';

    function driveSyncAvailable() {
      return !!(window.kyudoGetAccessToken && window.kyudoSyncStatus);
    }

    function getStoredUploadSession(id) {
      try {
        const raw = localStorage.getItem(DRIVE_SESSION_KEY_PREFIX + id);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function storeUploadSession(id, sessionUrl, size) {
      localStorage.setItem(DRIVE_SESSION_KEY_PREFIX + id, JSON.stringify({ url: sessionUrl, size }));
    }

    function clearUploadSession(id) {
      localStorage.removeItem(DRIVE_SESSION_KEY_PREFIX + id);
    }

    async function driveCreateResumableSession(token, fileName, mimeType, fileSize) {
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable', {
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token,
          'Content-Type': 'application/json; charset=UTF-8',
          'X-Upload-Content-Type': mimeType || 'application/octet-stream',
          'X-Upload-Content-Length': String(fileSize)
        },
        body: JSON.stringify({ name: fileName, parents: ['appDataFolder'] })
      });
      if (!res.ok) throw new Error('resumable_session_failed:' + res.status);
      const location = res.headers.get('Location');
      if (!location) throw new Error('resumable_session_no_location');
      return location;
    }

    // 中断later再開のため、サーバーに「どこまで受信済みか」を問い合わせる
    async function driveCheckUploadedOffset(sessionUrl, totalSize) {
      const res = await fetch(sessionUrl, {
        method: 'PUT',
        headers: { 'Content-Range': `bytes */${totalSize}` }
      });
      if (res.status === 200 || res.status === 201) {
        const json = await res.json().catch(() => null);
        return { done: true, fileId: json && json.id };
      }
      if (res.status === 308) {
        const range = res.headers.get('Range');
        if (range) {
          const m = /bytes=0-(\d+)/.exec(range);
          if (m) return { done: false, offset: parseInt(m[1], 10) + 1 };
        }
        return { done: false, offset: 0 };
      }
      // セッション自体が失効(404等)している場合は最初からやり直す
      throw new Error('session_invalid:' + res.status);
    }

    async function driveUploadFromOffset(sessionUrl, blob, offset, onProgress) {
      const total = blob.size;
      while (offset < total) {
        const end = Math.min(offset + DRIVE_UPLOAD_CHUNK, total);
        const chunk = blob.slice(offset, end);
        const res = await fetch(sessionUrl, {
          method: 'PUT',
          headers: {
            'Content-Range': `bytes ${offset}-${end - 1}/${total}`
          },
          body: chunk
        });
        if (res.status === 200 || res.status === 201) {
          const json = await res.json();
          if (onProgress) onProgress(total, total);
          return json.id;
        } else if (res.status === 308) {
          offset = end;
          if (onProgress) onProgress(offset, total);
        } else {
          throw new Error('chunk_upload_failed:' + res.status);
        }
      }
    }

    // 動画1本をGoogleドライブへアップロード（失敗しても他の機能には影響しない）
    async function uploadVideoToDrive(id, blob, onProgress) {
      if (!driveSyncAvailable()) return null;
      const status = window.kyudoSyncStatus();
      if (!status.signedIn) return null;

      const token = await window.kyudoGetAccessToken();
      if (!token) return null;

      const fileName = 'kyudo_video_' + id;
      let sessionUrl = null;
      let offset = 0;

      const stored = getStoredUploadSession(id);
      if (stored && stored.size === blob.size) {
        try {
          const check = await driveCheckUploadedOffset(stored.url, stored.size);
          if (check.done) {
            clearUploadSession(id);
            return check.fileId;
          }
          sessionUrl = stored.url;
          offset = check.offset;
        } catch (e) {
          // セッションが失効していたら新規作成し直す
          clearUploadSession(id);
        }
      }

      if (!sessionUrl) {
        sessionUrl = await driveCreateResumableSession(token, fileName, blob.type, blob.size);
        storeUploadSession(id, sessionUrl, blob.size);
        offset = 0;
      }

      const fileId = await driveUploadFromOffset(sessionUrl, blob, offset, onProgress);
      clearUploadSession(id);
      return fileId;
    }

    async function downloadVideoFromDrive(driveFileId) {
      if (!driveSyncAvailable()) return null;
      const token = await window.kyudoGetAccessToken();
      if (!token) return null;
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!res.ok) return null;
      return await res.blob();
    }

    const videoA = document.getElementById('videoA');
    const videoB = document.getElementById('videoB');
    const selectA = document.getElementById('selectA');
    const selectB = document.getElementById('selectB');
    const compareGrid = document.getElementById('compareGrid');
    let objectUrls = [];
    let pendingFile = null;

    function renderSelectOptions() {
      const meta = loadMeta();
      [selectA, selectB].forEach(sel => {
        const cur = sel.value;
        sel.innerHTML = '<option value="">動画を選択...</option>' +
          meta.map(m => `<option value="${m.id}">${m.title || '(無題)'}</option>`).join('');
        if (meta.some(m => String(m.id) === cur)) sel.value = cur;
      });
    }

    async function loadIntoSlot(videoEl, id, selectEl) {
      if (!id) {
        videoEl.removeAttribute('src');
        videoEl.load();
        updateSeekRange();
        return;
      }
      let blob = await idbGetVideo(Number(id));

      if (!blob) {
        // この端末には無いが、Googleドライブにバックアップ済みなら
        // そこからダウンロードして復元を試みる。
        const meta = loadMeta();
        const item = meta.find(m => String(m.id) === String(id));
        const status = driveSyncAvailable() ? window.kyudoSyncStatus() : null;

        if (item && item.driveFileId && status && status.signedIn) {
          if (selectEl) selectEl.disabled = true;
          try {
            blob = await downloadVideoFromDrive(item.driveFileId);
            if (blob) {
              await idbPutVideo(Number(id), blob);
            }
          } catch (e) {
            blob = null;
          } finally {
            if (selectEl) selectEl.disabled = false;
          }
        }
      }

      if (!blob) {
        // タイトル一覧(メタ情報)はGoogleドライブ経由で他端末にも同期されるが、
        // 動画データ本体はこの端末のIndexedDBにしか無いため、
        // ・別の端末で保存した動画をこの端末で選んだ場合
        // ・ブラウザのデータ消去やストレージ容量整理で消えてしまった場合
        // などに実体が見つからず、何も起きないように見えてしまっていた。
        // ここでは無反応にせず、理由をはっきり伝えてUIも選択前の状態に戻す。
        const meta = loadMeta();
        const item = meta.find(m => String(m.id) === String(id));
        const msg = (item && item.driveFileId)
          ? 'この動画をGoogleドライブから取得できませんでした。\nログイン状態やネットワーク接続を確認して、もう一度お試しください。'
          : 'この動画のデータが見つかりませんでした。\nこの端末に保存されておらず、Googleドライブへのバックアップもまだ無いようです。\nお手数ですが、この端末でもう一度動画を追加してください。';
        alert(msg);
        if (selectEl) selectEl.value = '';
        videoEl.removeAttribute('src');
        videoEl.load();
        updateSeekRange();
        return;
      }
      const url = URL.createObjectURL(blob);
      objectUrls.push(url);
      videoEl.src = url;
    }

    selectA.addEventListener('change', () => loadIntoSlot(videoA, selectA.value, selectA));
    selectB.addEventListener('change', () => loadIntoSlot(videoB, selectB.value, selectB));

    document.getElementById('layoutToggleBtn').addEventListener('click', () => {
      compareGrid.classList.toggle('vertical');
    });

    // Playback control
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    let isPlaying = false;

    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        videoA.pause();
        videoB.pause();
        playIcon.textContent = 'play_arrow';
        playLabel.textContent = '再生';
        playPauseBtn.classList.remove('active-red');
      } else {
        if (videoA.src) videoA.play().catch(()=>{});
        if (videoB.src) videoB.play().catch(()=>{});
        playIcon.textContent = 'pause';
        playLabel.textContent = '停止';
        playPauseBtn.classList.add('active-red');
      }
      isPlaying = !isPlaying;
    });

    document.getElementById('resetSyncBtn').addEventListener('click', () => {
      videoA.currentTime = 0;
      videoB.currentTime = 0;
      updateSeekPositionDisplay();
    });

    const FRAME_STEP = 1 / 30;
    document.getElementById('frameBackBtn').addEventListener('click', () => {
      videoA.pause(); videoB.pause();
      isPlaying = false;
      playIcon.textContent = 'play_arrow';
      playLabel.textContent = '再生';
      if (videoA.src) videoA.currentTime = Math.max(0, videoA.currentTime - FRAME_STEP);
      if (videoB.src) videoB.currentTime = Math.max(0, videoB.currentTime - FRAME_STEP);
      updateSeekPositionDisplay();
    });

    document.getElementById('frameFwdBtn').addEventListener('click', () => {
      videoA.pause(); videoB.pause();
      isPlaying = false;
      playIcon.textContent = 'play_arrow';
      playLabel.textContent = '再生';
      if (videoA.src) videoA.currentTime += FRAME_STEP;
      if (videoB.src) videoB.currentTime += FRAME_STEP;
      updateSeekPositionDisplay();
    });

    document.getElementById('speedSelect').addEventListener('change', (e) => {
      const spd = parseFloat(e.target.value);
      videoA.playbackRate = spd;
      videoB.playbackRate = spd;
    });

    // Seek Bar
    const seekBar = document.getElementById('seekBar');
    const seekCurrent = document.getElementById('seekCurrent');
    const seekDuration = document.getElementById('seekDuration');

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function updateSeekRange() {
      const durA = (videoA.src && isFinite(videoA.duration)) ? videoA.duration : 0;
      const durB = (videoB.src && isFinite(videoB.duration)) ? videoB.duration : 0;
      const maxDur = Math.max(durA, durB);
      seekBar.max = maxDur || 0;
      seekBar.disabled = maxDur <= 0;
      seekDuration.textContent = formatTime(maxDur);
      updateSeekPositionDisplay();
    }

    function updateSeekPositionDisplay() {
      const times = [];
      if (videoA.src) times.push(videoA.currentTime);
      if (videoB.src) times.push(videoB.currentTime);
      if (!times.length) {
        seekBar.value = 0;
        seekCurrent.textContent = '0:00';
        return;
      }
      const t = Math.max(...times);
      seekBar.value = t;
      seekCurrent.textContent = formatTime(t);
    }

    [videoA, videoB].forEach(v => {
      v.addEventListener('loadedmetadata', updateSeekRange);
      v.addEventListener('timeupdate', updateSeekPositionDisplay);
      v.addEventListener('ended', updateSeekPositionDisplay);
    });

    seekBar.addEventListener('input', (e) => {
      const t = parseFloat(e.target.value);
      if (videoA.src) videoA.currentTime = t;
      if (videoB.src) videoB.currentTime = t;
      seekCurrent.textContent = formatTime(t);
    });

    // Add Video
    const fileInput = document.getElementById('fileInput');
    const addModal = document.getElementById('addModalOverlay');
    document.getElementById('addVideoBtn').addEventListener('click', () => fileInput.click());

    // 複数ファイルをまとめて選んだ場合、1件ずつ順番にタイトル等を入力してもらうためのキュー
    let pendingQueue = [];
    let pendingQueueTotal = 0;

    function updateAddModalTitle() {
      const modalTitleEl = document.querySelector('#addModalOverlay h3');
      if (!modalTitleEl) return;
      if (pendingQueueTotal > 1) {
        const current = pendingQueueTotal - pendingQueue.length;
        modalTitleEl.textContent = `📹 動画情報の入力 (${current}/${pendingQueueTotal}件目)`;
      } else {
        modalTitleEl.textContent = '📹 動画情報の入力';
      }
    }

    function showNextPendingFile() {
      if (!pendingQueue.length) {
        pendingFile = null;
        pendingQueueTotal = 0;
        addModal.classList.remove('show');
        return;
      }
      pendingFile = pendingQueue.shift();
      document.getElementById('mTitle').value = pendingFile.name.replace(/\.[^/.]+$/, '');
      document.getElementById('mDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('mTag').value = '';
      updateAddModalTitle();
      addModal.classList.add('show');
    }

    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files || []);
      fileInput.value = '';
      if (!files.length) return;
      pendingQueue = files;
      pendingQueueTotal = files.length;
      showNextPendingFile();
    });

    document.getElementById('mCancelBtn').addEventListener('click', () => {
      // このファイルだけスキップして、残りがあれば続けて次の入力画面を表示
      pendingFile = null;
      showNextPendingFile();
    });

    document.getElementById('mSaveBtn').addEventListener('click', async () => {
      if (!pendingFile) return;
      const title = document.getElementById('mTitle').value.trim() || '(無題)';
      const date = document.getElementById('mDate').value || new Date().toISOString().split('T')[0];
      const tag = document.getElementById('mTag').value.trim();
      const fileToUpload = pendingFile;

      const id = Date.now() + Math.floor(Math.random() * 1000);
      await idbPutVideo(id, fileToUpload);

      const meta = loadMeta();
      meta.unshift({ id, title, date, tag, createdAt: Date.now(), driveFileId: null });
      saveMeta(meta);

      renderSelectOptions();
      renderLibrary();
      ensurePersistentStorage().then(renderStorageStatus);

      // ログイン中なら、保存直後にバックグラウンドでGoogleドライブへもアップロードしておく
      startBackgroundDriveUpload(id, fileToUpload);

      // 続けて次のファイルがあれば、閉じずにそのまま次の入力画面へ
      pendingFile = null;
      showNextPendingFile();
    });

    // 動画id -> {uploading, percent} のアップロード進捗（画面表示用）
    const driveUploadProgress = {};

    function startBackgroundDriveUpload(id, blob) {
      if (!driveSyncAvailable()) return;
      if (!window.kyudoSyncStatus().signedIn) return;

      driveUploadProgress[id] = { uploading: true, percent: 0 };
      renderLibrary();

      uploadVideoToDrive(id, blob, (sent, total) => {
        driveUploadProgress[id] = { uploading: true, percent: total ? Math.round((sent / total) * 100) : 0 };
        renderLibrary();
      }).then(fileId => {
        delete driveUploadProgress[id];
        if (fileId) updateMetaItem(id, { driveFileId: fileId });
        renderLibrary();
      }).catch(() => {
        // アップロード失敗時は静かに諦める（ローカル再生には影響しないため）。
        // ライブラリの「☁ アップロード」ボタンから手動で再試行できる。
        delete driveUploadProgress[id];
        renderLibrary();
      });
    }

    window.manualUploadToDrive = function (id) {
      idbGetVideo(Number(id)).then(blob => {
        if (!blob) {
          alert('この動画データがこの端末に見つかりません。');
          return;
        }
        startBackgroundDriveUpload(id, blob);
      });
    };

    async function renderLibrary() {
      const meta = loadMeta();
      const root = document.getElementById('library-root');
      if (!meta.length) {
        root.innerHTML = `<div class="uq-empty-box">まだ保存された動画がありません。「＋ 動画を追加」から動画を登録してください。</div>`;
        return;
      }

      // タイトル一覧(メタ情報)はGoogleドライブ経由で端末間で同期されるが、
      // 動画データ本体はこの端末のIndexedDBにしか存在しないため、
      // 「一覧には出るが、この端末には実体が無い」項目があり得る。
      // 事前に判定して、選んでも何も起きないように見える状態を防ぐ。
      const existsList = await Promise.all(
        meta.map(m => idbVideoExists(Number(m.id)).catch(() => false))
      );
      const syncStatus = driveSyncAvailable() ? window.kyudoSyncStatus() : { signedIn: false };

      root.innerHTML = meta.map((m, i) => {
        const available = existsList[i];
        const progress = driveUploadProgress[m.id];
        const hasDriveBackup = !!m.driveFileId;

        let statusNote = '';
        if (!available && hasDriveBackup) {
          statusNote = `<div class="uq-lib-meta">☁ ドライブに保存済み（選択すると自動でダウンロードします）</div>`;
        } else if (!available && !hasDriveBackup) {
          statusNote = `<div class="uq-lib-meta" style="color:var(--uq-red);">⚠ この端末にデータがありません（他端末で保存した動画の可能性）</div>`;
        } else if (progress && progress.uploading) {
          statusNote = `<div class="uq-lib-meta">☁ アップロード中… ${progress.percent}%</div>`;
        } else if (hasDriveBackup) {
          statusNote = `<div class="uq-lib-meta">☁ バックアップ済み</div>`;
        }

        const showUploadBtn = available && !hasDriveBackup && !(progress && progress.uploading) && syncStatus.signedIn;

        return `
        <div class="uq-library-item"${available ? '' : ' style="opacity:0.6;"'}>
          <div class="uq-lib-info">
            <div class="uq-lib-title">${m.title || '(無題)'}</div>
            <div class="uq-lib-meta">${m.date || '─'}</div>
            ${m.tag ? `<span class="uq-lib-tag">🏷 ${m.tag}</span>` : ''}
            ${statusNote}
          </div>
          <div class="uq-lib-actions">
            <button class="uq-btn primary" onclick="useInSlot(${m.id}, 'A')">Aに設定</button>
            <button class="uq-btn" onclick="useInSlot(${m.id}, 'B')">Bに設定</button>
            ${showUploadBtn ? `<button class="uq-btn" onclick="manualUploadToDrive(${m.id})">☁ アップロード</button>` : ''}
            <button class="uq-btn danger" onclick="deleteVideo(${m.id})">削除</button>
          </div>
        </div>
      `;
      }).join('');
    }

    window.useInSlot = function(id, slot) {
      const sel = slot === 'A' ? selectA : selectB;
      const vid = slot === 'A' ? videoA : videoB;
      sel.value = String(id);
      loadIntoSlot(vid, String(id), sel);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteVideo = async function(id) {
      if (!confirm('この動画をライブラリから削除しますか？\n（Googleドライブにバックアップ済みの場合は、そちらからも削除されます）')) return;
      const meta = loadMeta();
      const item = meta.find(m => m.id === id);
      await idbDeleteVideo(id);

      if (item && item.driveFileId && driveSyncAvailable()) {
        window.kyudoGetAccessToken().then(token => {
          if (!token) return;
          fetch(`https://www.googleapis.com/drive/v3/files/${item.driveFileId}`, {
            method: 'DELETE',
            headers: { Authorization: 'Bearer ' + token }
          }).catch(() => {});
        }).catch(() => {});
      }

      const newMeta = meta.filter(m => m.id !== id);
      saveMeta(newMeta);
      renderSelectOptions();
      renderLibrary();
    };

    renderSelectOptions();
    renderLibrary();

    function toggleDrawer() {
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const isOpen = drawer.classList.contains('open');
      if (isOpen) {
        drawer.classList.remove('open');
        overlay.classList.remove('show');
      } else {
        drawer.classList.add('open');
        overlay.classList.add('show');
      }
    }

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    function updateTheme(isDark) {
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.textContent = 'light_mode';
        localStorage.setItem('kyudo_dark_mode', '1');
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.textContent = 'dark_mode';
        localStorage.setItem('kyudo_dark_mode', '0');
      }
    }

    if (localStorage.getItem('kyudo_dark_mode') === '1') {
      updateTheme(true);
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      updateTheme(!isDark);
    });
  </script>
</body>
</html>
